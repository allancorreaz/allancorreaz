name: Atualizar perfil
on:
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - README.md
      - scripts/update_profile.py
      - .github/workflows/update-profile.yml
permissions:
  contents: write
concurrency:
  group: update-profile
  cancel-in-progress: false
jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Atualizar projetos e estatísticas públicas
        env:
          GH_TOKEN: ${{ github.token }}
          PROFILE_OWNER: ${{ github.repository_owner }}
        run: python scripts/update_profile.py
      - name: Publicar somente quando houver alterações
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add README.md profile/activity.svg
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'chore: atualiza projetos e atividade do perfil'
          git push
